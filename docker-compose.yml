services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_SKIP_BROWSER_CONTROL_SERVER: ${OPENCLAW_SKIP_BROWSER_CONTROL_SERVER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VENICE_API_KEY: ${VENICE_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      PYTHIA_BASE_PRIVATE_KEY: ${PYTHIA_BASE_PRIVATE_KEY}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      AGENTGLOB_RUNTIME_URL: ${AGENTGLOB_RUNTIME_URL:-}
      AGENTGLOB_RUNTIME_TOKEN: ${AGENTGLOB_RUNTIME_TOKEN:-}
      # Per-agent Plusim reports skill (plusim.xyz). Same allowlist rule as the
      # GMAIL_* pair below: written to docker.env by the operator, reaches the
      # container only via this list. Empty for agents without the skill.
      PLUSIM_RUNTIME_URL: ${PLUSIM_RUNTIME_URL:-}
      PLUSIM_RUNTIME_TOKEN: ${PLUSIM_RUNTIME_TOKEN:-}
      # Per-agent Gmail (dashboard Tools → Email). This compose has NO env_file,
      # so a key written to docker.env reaches the container ONLY if it is
      # allowlisted here. The `:-` gives an empty string (not a compose warning)
      # for agents with no connected mailbox — harmless, since the gmail skill is
      # installed per-agent only on connect, so a non-connected agent never runs
      # it. A connected agent's docker.env carries the real value.
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # Per-agent Google Calendar (dashboard Tools → Calendar). Same allowlist
      # rule as the GMAIL_* pair above. These two are NOT secrets-in-Google
      # terms: the URL is public and the token authenticates ONLY against the
      # dashboard's Calendar broker (one endpoint, per-agent, killed the instant
      # the agent is disabled). The Google refresh token never comes near this
      # file — it stays encrypted in Firestore. The skill declares BOTH keys in
      # requires.env with ALL semantics, so an agent missing either never sees
      # the skill at all.
      GCAL_RUNTIME_URL: ${GCAL_RUNTIME_URL:-}
      GCAL_RUNTIME_TOKEN: ${GCAL_RUNTIME_TOKEN:-}
      # here.now publishing/Drive key (dashboard Tools -> Core API Keys).
      # Same allowlist rule as the GMAIL_*/GCAL_* keys above: with no env_file,
      # a per-agent docker.env key reaches the container ONLY if listed here.
      HERE_NOW: ${HERE_NOW:-}
      # ostium skill (skills/ostium/SKILL.md) — RPC_URL gates whether the
      # skill loads at all; PRIVATE_KEY is required only for write actions.
      # Same allowlist rule as every other key in this file: with no
      # env_file, a docker.env value reaches the container ONLY if listed
      # here. Found missing fleet-wide by the OB-22 diagnostic guard
      # (openclaw #114) on its first run — all 16 EU agents had RPC_URL +
      # PRIVATE_KEY saved in docker.env with an empty container env.
      RPC_URL: ${RPC_URL:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      # nano-banana-pro skill (image generation) and summarize's optional
      # Gemini path. Found missing on eu/mystory by the same OB-22 guard —
      # 16 code readers across two skills, zero compose entries.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    # NOTE (channel-error-hardening B3, REVERTED 2026-06-10): mem_limit: 1g +
    # cpus: 1.0 OOM-crash-cycled the entire EU fleet on rollout — V8 aborts
    # (FatalProcessOutOfMemory) during gateway boot under a 1 GiB cgroup cap
    # even though steady-state RSS is only 248–440 MiB. Do not re-add a memory
    # cap without pairing it with NODE_OPTIONS=--max-old-space-size sized
    # below the cap, and canary on testingbot (EU) first.
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_SKIP_BROWSER_CONTROL_SERVER: ${OPENCLAW_SKIP_BROWSER_CONTROL_SERVER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VENICE_API_KEY: ${VENICE_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      PYTHIA_BASE_PRIVATE_KEY: ${PYTHIA_BASE_PRIVATE_KEY}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      AGENTGLOB_RUNTIME_URL: ${AGENTGLOB_RUNTIME_URL:-}
      AGENTGLOB_RUNTIME_TOKEN: ${AGENTGLOB_RUNTIME_TOKEN:-}
      # Per-agent Plusim reports skill (plusim.xyz). Same allowlist rule as the
      # GMAIL_* pair below: written to docker.env by the operator, reaches the
      # container only via this list. Empty for agents without the skill.
      PLUSIM_RUNTIME_URL: ${PLUSIM_RUNTIME_URL:-}
      PLUSIM_RUNTIME_TOKEN: ${PLUSIM_RUNTIME_TOKEN:-}
      # Per-agent Gmail (dashboard Tools → Email). This compose has NO env_file,
      # so a key written to docker.env reaches the container ONLY if it is
      # allowlisted here. The `:-` gives an empty string (not a compose warning)
      # for agents with no connected mailbox — harmless, since the gmail skill is
      # installed per-agent only on connect, so a non-connected agent never runs
      # it. A connected agent's docker.env carries the real value.
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # Per-agent Google Calendar (dashboard Tools → Calendar). Same allowlist
      # rule as the GMAIL_* pair above. These two are NOT secrets-in-Google
      # terms: the URL is public and the token authenticates ONLY against the
      # dashboard's Calendar broker (one endpoint, per-agent, killed the instant
      # the agent is disabled). The Google refresh token never comes near this
      # file — it stays encrypted in Firestore. The skill declares BOTH keys in
      # requires.env with ALL semantics, so an agent missing either never sees
      # the skill at all.
      GCAL_RUNTIME_URL: ${GCAL_RUNTIME_URL:-}
      GCAL_RUNTIME_TOKEN: ${GCAL_RUNTIME_TOKEN:-}
      # here.now publishing/Drive key (dashboard Tools -> Core API Keys).
      # Same allowlist rule as the GMAIL_*/GCAL_* keys above: with no env_file,
      # a per-agent docker.env key reaches the container ONLY if listed here.
      HERE_NOW: ${HERE_NOW:-}
      # ostium skill (skills/ostium/SKILL.md) — RPC_URL gates whether the
      # skill loads at all; PRIVATE_KEY is required only for write actions.
      # Same allowlist rule as every other key in this file: with no
      # env_file, a docker.env value reaches the container ONLY if listed
      # here. Found missing fleet-wide by the OB-22 diagnostic guard
      # (openclaw #114) on its first run — all 16 EU agents had RPC_URL +
      # PRIVATE_KEY saved in docker.env with an empty container env.
      RPC_URL: ${RPC_URL:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      # nano-banana-pro skill (image generation) and summarize's optional
      # Gemini path. Found missing on eu/mystory by the same OB-22 guard —
      # 16 code readers across two skills, zero compose entries.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
