services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_SKIP_BROWSER_CONTROL_SERVER: ${OPENCLAW_SKIP_BROWSER_CONTROL_SERVER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VENICE_API_KEY: ${VENICE_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      PYTHIA_BASE_PRIVATE_KEY: ${PYTHIA_BASE_PRIVATE_KEY}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      AGENTGLOB_RUNTIME_URL: ${AGENTGLOB_RUNTIME_URL:-}
      AGENTGLOB_RUNTIME_TOKEN: ${AGENTGLOB_RUNTIME_TOKEN:-}
      # Per-agent Plusim reports skill (plusim.xyz). Same allowlist rule as the
      # GMAIL_* pair below: written to docker.env by the operator, reaches the
      # container only via this list. Empty for agents without the skill.
      PLUSIM_RUNTIME_URL: ${PLUSIM_RUNTIME_URL:-}
      PLUSIM_RUNTIME_TOKEN: ${PLUSIM_RUNTIME_TOKEN:-}
      # Per-agent Gmail (dashboard Tools → Email). This compose has NO env_file,
      # so a key written to docker.env reaches the container ONLY if it is
      # allowlisted here. The `:-` gives an empty string (not a compose warning)
      # for agents with no connected mailbox — harmless, since the gmail skill is
      # installed per-agent only on connect, so a non-connected agent never runs
      # it. A connected agent's docker.env carries the real value.
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # Per-agent Google Calendar (dashboard Tools → Calendar). Same allowlist
      # rule as the GMAIL_* pair above. These two are NOT secrets-in-Google
      # terms: the URL is public and the token authenticates ONLY against the
      # dashboard's Calendar broker (one endpoint, per-agent, killed the instant
      # the agent is disabled). The Google refresh token never comes near this
      # file — it stays encrypted in Firestore. The skill declares BOTH keys in
      # requires.env with ALL semantics, so an agent missing either never sees
      # the skill at all.
      GCAL_RUNTIME_URL: ${GCAL_RUNTIME_URL:-}
      GCAL_RUNTIME_TOKEN: ${GCAL_RUNTIME_TOKEN:-}
      # here.now publishing/Drive key (dashboard Tools -> Core API Keys).
      # Same allowlist rule as the GMAIL_*/GCAL_* keys above: with no env_file,
      # a per-agent docker.env key reaches the container ONLY if listed here.
      HERE_NOW: ${HERE_NOW:-}
      # nano-banana-pro skill (image generation) and summarize's optional
      # Gemini path. Found missing on eu/mystory by the same OB-22 guard —
      # 16 code readers across two skills, zero compose entries.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Per-agent Salesforce (dashboard Tools -> Salesforce). The dashboard writes
      # these to docker.env and registers the MCP server with env: {}, so the
      # bridge sees them only through process.env, i.e. only if listed here.
      SALESFORCE_CONNECTION_TYPE: ${SALESFORCE_CONNECTION_TYPE:-}
      SALESFORCE_INSTANCE_URL: ${SALESFORCE_INSTANCE_URL:-}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      # OpenAI Codex (ChatGPT subscription) login file. openclaw reads it from
      # $CODEX_HOME/auth.json, default ~/.codex — a path that is NOT a mount, so
      # a login done inside the container died on the next recreate. Pointing it
      # inside the config-dir bind keeps it on the host with the rest of the
      # agent state. Not a secret and identical for every agent, so hardcoded
      # rather than routed through docker.env.
      CODEX_HOME: /home/node/.openclaw/.codex
      # Ceyo partner-outreach Agents (dashboard plan docs/plans/active/ceyo-outreach-grid.md,
      # Phase 1). Same allowlist rule as GMAIL_*: written to the agent's docker.env by the
      # operator, reaches the container only via this list; empty for every other agent.
      # AIRTABLE_TOKEN is scoped to the `companies` base; AIRTABLE_REVIEWS_TOKEN is read-only on
      # a second base; OUTREACH_ROLE binds the airtable skill script to one Role. HUBSPOT_TOKEN
      # carries read scopes only.
      AIRTABLE_TOKEN: ${AIRTABLE_TOKEN:-}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-}
      AIRTABLE_REVIEWS_TOKEN: ${AIRTABLE_REVIEWS_TOKEN:-}
      AIRTABLE_REVIEWS_BASE_ID: ${AIRTABLE_REVIEWS_BASE_ID:-}
      OUTREACH_ROLE: ${OUTREACH_ROLE:-}
      HUBSPOT_TOKEN: ${HUBSPOT_TOKEN:-}
      # social-bob's Customer check (dashboard plan docs/plans/active/social-bob-customer-check.md
      # §2.5): a SEPARATE write key (tickets + contacts) under its own name, so a read-only Agent
      # never holds it under HUBSPOT_TOKEN. Same allowlist rule: empty for every other agent.
      HUBSPOT_TICKETS_TOKEN: ${HUBSPOT_TICKETS_TOKEN:-}
      # EXA_API_KEY is the scout's company finder (exa-search skill). Read-only: the script it
      # backs has one hardcoded endpoint and no verb that writes or looks a person up. The name is
      # the one the dashboard's Secrets tab suggests, and the skill's `requires.env` gates on it
      # with ALL semantics — a second spelling would hide the skill rather than add a fallback.
      EXA_API_KEY: ${EXA_API_KEY:-}
      # Phase 2 (dashboard plan docs/plans/active/ceyo-outreach-phase2.md §2.6, C2/C11): the
      # prospector's five provider keys, and the bound sweep job id. OUTREACH_CRON_JOB is what the
      # scripts' session gate compares the session key against; ceyo-provision.sh writes it to
      # docker.env, and it reaches the script process ONLY through this list — absent here, every
      # gated write (the sweep's own included) fails closed after deploy. Empty for every other agent.
      OUTREACH_CRON_JOB: ${OUTREACH_CRON_JOB:-}
      # Stage provenance (dashboard #565; the failure that found this, #569 rollout,
      # measured 2026-09-10). `ceyo-provision.sh` derives both and writes them to the agent's
      # docker.env — OUTREACH_PROMPT_VERSION is a content hash of the Role's deployed prompt
      # files, OUTREACH_MODEL_ID is the CONFIGURED primary model, stored with the literal
      # marker "(configured)" because fallback stays on and nothing reports which model
      # answered (calibration D15). Same allowlist rule as OUTREACH_CRON_JOB above: absent
      # here they never reach the script process, and every write that records a decision
      # fails closed with exit 2 — which is exactly what happened: docker.env carried both,
      # `docker inspect` showed neither, and the re-provisioned agent refused its own sweep.
      OUTREACH_PROMPT_VERSION: ${OUTREACH_PROMPT_VERSION:-}
      OUTREACH_MODEL_ID: ${OUTREACH_MODEL_ID:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      DEBOUNCE_API_KEY: ${DEBOUNCE_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      LEMLIST_API_KEY: ${LEMLIST_API_KEY:-}
      # OB-14 (docs/experiments/plans/gateway-memory-ob14.md): load plugins with Node's own loader.
      # Without it jiti Babel-transpiles a second copy of the gateway's dependency graph on every
      # fresh boot (482 files, ~650 MB live heap, 1.3–2.3 GB peak RSS). Escape hatch per Agent:
      # OPENCLAW_JITI_TRY_NATIVE=0 restores the old loader. Set it ONLY together with the tested
      # native-off heap/memory values in the plan's Rollback table: the old loader cannot boot
      # under the default 768 heap cap.
      JITI_TRY_NATIVE: ${OPENCLAW_JITI_TRY_NATIVE:-1}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      # Secrets shadow (dashboard#359 Rev 28, Invariant 17). The config-dir bind
      # above exposes the agent's own docker.env — the file compose itself reads
      # for ${OPENCLAW_GATEWAY_PORT} etc. — to the container, wallet keys
      # included. The container NEVER reads it (this compose has no env_file;
      # the environment allowlist above is the only conduit — verified against
      # the running fleet), so an empty read-only file is mounted over it.
      # /opt/openclaw/empty.env is created by deploy.sh on every deploy.
      # REMOVING THIS LINE RE-EXPOSES EVERY SECRET; the daily diagnostic
      # (agents_server_diagnostic.sh) alerts P1 if any container can read a
      # non-empty secrets file.
      - /opt/openclaw/empty.env:/home/node/.openclaw/docker.env:ro
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    # OB-14: a backstop for what the heap flag below does not bound (native memory, Buffers, MCP
    # children). Safe ONLY together with the explicit heap flag: without it Node derives the heap
    # from this limit (B3, 2026-06-10). Keep OPENCLAW_MEM_LIMIT >= OPENCLAW_MAX_OLD_SPACE_MB + 768m.
    mem_limit: ${OPENCLAW_MEM_LIMIT:-1536m}
    # OB-14: explicit heap cap. Without it Node sizes the heap from the RAM it sees (~2.1 GB per
    # gateway here), and under a cgroup limit from that limit, which is what crash-looped the EU
    # fleet in B3 (2026-06-10). Depends on JITI_TRY_NATIVE above: the transpiling loader needs
    # ~700 MB of heap to boot. Per-Agent override: OPENCLAW_MAX_OLD_SPACE_MB in its docker.env.
    command:
      [
        "node",
        "--max-old-space-size=${OPENCLAW_MAX_OLD_SPACE_MB:-768}",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

